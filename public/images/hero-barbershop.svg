<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="heroWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242220"/>
      <stop offset="100%" stop-color="#151312"/>
    </linearGradient>
    <linearGradient id="heroMirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3733"/>
      <stop offset="55%" stop-color="#2B2825"/>
      <stop offset="100%" stop-color="#221F1C"/>
    </linearGradient>
    <linearGradient id="heroChair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C79B57"/>
      <stop offset="100%" stop-color="#8B6E3A"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#F2EAD9" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#F2EAD9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" rx="28" fill="url(#heroWall)"/>

  <!-- floor -->
  <rect x="0" y="860" width="800" height="140" fill="#0F0E0D"/>
  <path d="M0 860h800M0 900h800M0 940h800" stroke="#2B2825" stroke-width="2" opacity=".6"/>

  <!-- pendant light + glow -->
  <rect width="800" height="500" fill="url(#heroGlow)"/>
  <path d="M420 0v70" stroke="#5A4E32" stroke-width="3"/>
  <path d="M400 70h40l14 34h-68z" fill="#AD8A4E"/>
  <ellipse cx="420" cy="150" rx="90" ry="14" fill="#F2EAD9" opacity=".08"/>

  <!-- mirror -->
  <rect x="70" y="90" width="300" height="470" rx="14" fill="#0F0E0D"/>
  <rect x="86" y="106" width="268" height="438" rx="8" fill="url(#heroMirror)"/>
  <rect x="86" y="106" width="268" height="438" rx="8" stroke="#AD8A4E" stroke-width="4" fill="none"/>
  <path d="M110 140l60 400M150 140l40 400" stroke="#F2EAD9" stroke-width="8" opacity=".05"/>
  <circle cx="220" cy="290" r="72" fill="#AD8A4E" opacity=".22"/>
  <path d="M170 330c8 34 30 58 62 58" stroke="#AD8A4E" stroke-width="4" fill="none" opacity=".3" stroke-linecap="round"/>

  <!-- shelf with products, right of mirror -->
  <rect x="410" y="120" width="330" height="14" rx="4" fill="#3A362F"/>
  <g>
    <rect x="432" y="60" width="26" height="60" rx="5" fill="#AD8A4E"/>
    <rect x="470" y="44" width="22" height="76" rx="5" fill="#2B2825"/>
    <rect x="504" y="66" width="30" height="54" rx="6" fill="#8B6E3A"/>
    <rect x="546" y="50" width="20" height="70" rx="5" fill="#1B1917"/>
    <rect x="578" y="72" width="26" height="48" rx="5" fill="#AD8A4E"/>
    <rect x="616" y="56" width="22" height="64" rx="5" fill="#2B2825"/>
    <rect x="650" y="80" width="30" height="40" rx="6" fill="#8B6E3A"/>
    <rect x="694" y="58" width="20" height="62" rx="5" fill="#1B1917"/>
  </g>
  <rect x="410" y="240" width="330" height="14" rx="4" fill="#3A362F"/>
  <g opacity=".85">
    <rect x="440" y="180" width="24" height="56" rx="5" fill="#1B1917"/>
    <rect x="478" y="190" width="28" height="46" rx="6" fill="#AD8A4E"/>
    <rect x="520" y="170" width="20" height="66" rx="5" fill="#2B2825"/>
    <rect x="560" y="196" width="26" height="40" rx="5" fill="#8B6E3A"/>
    <rect x="610" y="182" width="22" height="54" rx="5" fill="#1B1917"/>
    <rect x="650" y="192" width="30" height="44" rx="6" fill="#AD8A4E"/>
  </g>

  <!-- barber chair -->
  <g>
    <rect x="490" y="800" width="200" height="40" rx="14" fill="#0F0E0D"/>
    <rect x="565" y="700" width="50" height="110" rx="10" fill="#3A362F"/>
    <path d="M540 700h100l10 20h-120z" fill="#2B2825"/>
    <rect x="520" y="560" width="140" height="150" rx="24" fill="url(#heroChair)"/>
    <rect x="500" y="380" width="180" height="200" rx="28" fill="url(#heroChair)"/>
    <rect x="530" y="330" width="120" height="80" rx="20" fill="url(#heroChair)"/>
    <rect x="470" y="560" width="36" height="100" rx="16" fill="#8B6E3A"/>
    <rect x="674" y="560" width="36" height="100" rx="16" fill="#8B6E3A"/>
    <path d="M500 420h180" stroke="#6E5730" stroke-width="3" opacity=".5"/>
    <path d="M500 480h180" stroke="#6E5730" stroke-width="3" opacity=".5"/>
  </g>

  <!-- brass barber pole accent, foreground left -->
  <g>
    <rect x="130" y="700" width="26" height="180" rx="13" fill="#AD8A4E"/>
    <path d="M130 700l26 26M130 726l26 26M130 752l26 26M130 778l26 26M130 804l26 26M130 830l26 26" stroke="#1B1917" stroke-width="6" opacity=".35"/>
    <circle cx="143" cy="694" r="16" fill="#1B1917"/>
    <rect x="118" y="878" width="50" height="16" rx="6" fill="#1B1917"/>
  </g>
</svg>
