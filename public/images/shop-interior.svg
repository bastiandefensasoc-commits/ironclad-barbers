<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="shopWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2EAD9"/>
      <stop offset="100%" stop-color="#E7DCC5"/>
    </linearGradient>
    <linearGradient id="shopChair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B2825"/>
      <stop offset="100%" stop-color="#151312"/>
    </linearGradient>
    <linearGradient id="shopFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9AC8C"/>
      <stop offset="100%" stop-color="#9E9074"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#shopWall)"/>
  <rect x="0" y="0" width="1200" height="30" fill="#DCD2C0"/>

  <!-- window with soft light -->
  <rect x="960" y="40" width="200" height="220" rx="10" fill="#F6F2EA"/>
  <rect x="960" y="40" width="200" height="220" rx="10" stroke="#AD8A4E" stroke-width="5" fill="none"/>
  <path d="M1060 40v220M960 150h200" stroke="#AD8A4E" stroke-width="4" opacity=".6"/>
  <path d="M980 60l60 200M1150 60l-70 200" stroke="#F2EAD9" stroke-width="18" opacity=".5"/>

  <!-- three stations -->
  <g id="station1">
    <rect x="70" y="70" width="240" height="360" rx="12" fill="#1B1917"/>
    <rect x="92" y="92" width="196" height="290" rx="8" fill="#2B2825"/>
    <rect x="92" y="92" width="196" height="290" rx="8" stroke="#AD8A4E" stroke-width="3" fill="none"/>
    <circle cx="190" cy="230" r="66" fill="#AD8A4E" opacity=".22"/>
  </g>
  <g id="station2">
    <rect x="480" y="70" width="240" height="360" rx="12" fill="#1B1917"/>
    <rect x="502" y="92" width="196" height="290" rx="8" fill="#2B2825"/>
    <rect x="502" y="92" width="196" height="290" rx="8" stroke="#AD8A4E" stroke-width="3" fill="none"/>
    <circle cx="600" cy="230" r="66" fill="#AD8A4E" opacity=".22"/>
  </g>
  <g id="station3">
    <rect x="890" y="70" width="240" height="360" rx="12" fill="#1B1917"/>
    <rect x="912" y="92" width="196" height="290" rx="8" fill="#2B2825"/>
    <rect x="912" y="92" width="196" height="290" rx="8" stroke="#AD8A4E" stroke-width="3" fill="none"/>
    <circle cx="1010" cy="230" r="66" fill="#AD8A4E" opacity=".22"/>
  </g>

  <!-- shelf strip under mirrors -->
  <rect x="60" y="440" width="1090" height="16" rx="5" fill="#DCD2C0"/>
  <g fill="#AD8A4E" opacity=".85">
    <rect x="150" y="410" width="16" height="34" rx="4"/>
    <rect x="180" y="400" width="14" height="44" rx="4"/>
    <rect x="210" y="416" width="18" height="28" rx="4"/>
    <rect x="560" y="404" width="16" height="40" rx="4"/>
    <rect x="590" y="414" width="14" height="30" rx="4"/>
    <rect x="620" y="398" width="18" height="46" rx="4"/>
    <rect x="970" y="410" width="16" height="34" rx="4"/>
    <rect x="1000" y="400" width="14" height="44" rx="4"/>
    <rect x="1030" y="418" width="18" height="26" rx="4"/>
  </g>

  <!-- floor -->
  <rect x="0" y="470" width="1200" height="230" fill="url(#shopFloor)"/>
  <path d="M0 470h1200" stroke="#8B7F62" stroke-width="4"/>
  <path d="M100 470v230M300 470v230M500 470v230M700 470v230M900 470v230M1100 470v230" stroke="#8B7F62" stroke-width="2" opacity=".4"/>

  <!-- three barber chairs on the floor -->
  <g id="chair1">
    <rect x="150" y="600" width="80" height="20" rx="8" fill="#151312"/>
    <rect x="178" y="540" width="24" height="66" rx="8" fill="#3A362F"/>
    <rect x="140" y="470" width="100" height="80" rx="16" fill="url(#shopChair)"/>
    <rect x="150" y="410" width="80" height="70" rx="14" fill="url(#shopChair)"/>
  </g>
  <g id="chair2">
    <rect x="560" y="600" width="80" height="20" rx="8" fill="#151312"/>
    <rect x="588" y="540" width="24" height="66" rx="8" fill="#3A362F"/>
    <rect x="550" y="470" width="100" height="80" rx="16" fill="url(#shopChair)"/>
    <rect x="560" y="410" width="80" height="70" rx="14" fill="url(#shopChair)"/>
  </g>
  <g id="chair3">
    <rect x="970" y="600" width="80" height="20" rx="8" fill="#151312"/>
    <rect x="998" y="540" width="24" height="66" rx="8" fill="#3A362F"/>
    <rect x="960" y="470" width="100" height="80" rx="16" fill="url(#shopChair)"/>
    <rect x="970" y="410" width="80" height="70" rx="14" fill="url(#shopChair)"/>
  </g>

  <!-- pendant lights -->
  <g stroke="#8B7F62" stroke-width="3">
    <path d="M190 30v40"/>
    <path d="M600 30v40"/>
    <path d="M1010 30v40"/>
  </g>
  <g fill="#AD8A4E">
    <path d="M170 70h40l10 24h-60z"/>
    <path d="M580 70h40l10 24h-60z"/>
    <path d="M990 70h40l10 24h-60z"/>
  </g>
</svg>
